<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The method — seven ways to get unstuck</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --paper: #FFFFFF;
      --band: #F7F6FF;
      --ink: #0E1230;
      --ink-soft: #4A4F66;
      --ink-faint: #6B7087;
      --line: #E4E4EA;
      --line-strong: #CFCFD8;
      --primary: #4B4EF6;
      --primary-tint: #EEEDFF;
      --info: #026AA2;
      --font-display: 'Cabinet Grotesk', 'Inter', ui-sans-serif, system-ui, sans-serif;
      --font-text: 'Inter', ui-sans-serif, system-ui, sans-serif;
    }
    body {
      font-family: var(--font-text);
      background: var(--paper);
      color: var(--ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1040px; width: 100%; }
    .eyebrow {
      font-family: var(--font-text);
      font-size: 0.625rem;
      font-weight: 600;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--ink-faint);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-display);
      font-size: 1.75rem;
      font-weight: 700;
      letter-spacing: -0.01em;
      line-height: 1.15;
      color: var(--ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 560px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Process with a loop-back · Hire From PH</p>
    <h1>The method — seven ways to get unstuck</h1>

    <svg viewBox="0 0 704 248" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="method-loop-title method-loop-desc">
      <title id="method-loop-title">The method — seven ways to get unstuck</title>
      <desc id="method-loop-desc">Seven methods in order — find, deconstruct, learn, vet, ask, unstick, give — drawn as a serpentine chain, with a dashed return arrow from unstick back to ask labelled "time-box, then ask"; give is the one highlighted step.</desc>

      <defs>
        <marker id="method-loop-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4A4F66"/></marker>
        <marker id="method-loop-arrow-sm" markerWidth="6" markerHeight="5" refX="5" refY="2.5" orient="auto"><polygon points="0 0, 6 2.5, 0 5" fill="#6B7087"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#FFFFFF"/>

      <!-- Connectors first (z-order) -->
      <line x1="144" y1="56" x2="204" y2="56" stroke="#4A4F66" stroke-width="1" marker-end="url(#method-loop-arrow)"/>
      <line x1="320" y1="56" x2="380" y2="56" stroke="#4A4F66" stroke-width="1" marker-end="url(#method-loop-arrow)"/>
      <line x1="496" y1="56" x2="556" y2="56" stroke="#4A4F66" stroke-width="1" marker-end="url(#method-loop-arrow)"/>

      <!-- VET → ASK: right, down the outer corridor, back in from the right -->
      <path d="M 672,56 H 680 Q 688,56 688,64 V 156 Q 688,164 680,164 H 588"
            fill="none" stroke="#4A4F66" stroke-width="1" marker-end="url(#method-loop-arrow)"/>

      <line x1="472" y1="164" x2="412" y2="164" stroke="#4A4F66" stroke-width="1" marker-end="url(#method-loop-arrow)"/>
      <line x1="296" y1="164" x2="236" y2="164" stroke="#4A4F66" stroke-width="1" marker-end="url(#method-loop-arrow)"/>

      <!-- UNSTICK → ASK: the return loop, dashed -->
      <path d="M 352,188 V 208 Q 352,216 360,216 H 520 Q 528,216 528,208 V 192"
            fill="none" stroke="#6B7087" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#method-loop-arrow-sm)"/>
      <rect x="384" y="192" width="112" height="16" rx="4" fill="#FFFFFF"/>
      <text x="440" y="204" fill="#6B7087" font-family="'Inter', ui-sans-serif, system-ui, sans-serif" font-size="10" font-weight="500" letter-spacing="0.6" text-anchor="middle">time-box, then ask</text>

      <!-- Row A -->
      <rect x="32"  y="32" width="112" height="48" rx="8" fill="#FFFFFF" stroke="#CFCFD8" stroke-width="1"/>
      <rect x="208" y="32" width="112" height="48" rx="8" fill="#FFFFFF" stroke="#CFCFD8" stroke-width="1"/>
      <rect x="384" y="32" width="112" height="48" rx="8" fill="#FFFFFF" stroke="#CFCFD8" stroke-width="1"/>
      <rect x="560" y="32" width="112" height="48" rx="8" fill="#FFFFFF" stroke="#CFCFD8" stroke-width="1"/>

      <!-- Row B — GIVE is the single focal node -->
      <rect x="472" y="140" width="112" height="48" rx="8" fill="#FFFFFF" stroke="#CFCFD8" stroke-width="1"/>
      <rect x="296" y="140" width="112" height="48" rx="8" fill="#FFFFFF" stroke="#CFCFD8" stroke-width="1"/>
      <rect x="120" y="140" width="112" height="48" rx="8" fill="#EEEDFF" stroke="#4B4EF6" stroke-width="1.2"/>

      <g font-family="'Inter', ui-sans-serif, system-ui, sans-serif" text-anchor="middle">
        <g fill="#0E1230" font-size="12" font-weight="600">
          <text x="88"  y="52">FIND</text>
          <text x="264" y="52">DECONSTRUCT</text>
          <text x="440" y="52">LEARN</text>
          <text x="616" y="52">VET</text>
          <text x="528" y="160">ASK</text>
          <text x="352" y="160">UNSTICK</text>
          <text x="176" y="160">GIVE</text>
        </g>
        <g fill="#4A4F66" font-size="10" font-weight="500">
          <text x="88"  y="68">any answer</text>
          <text x="264" y="68">from 5 examples</text>
          <text x="440" y="68">by building</text>
          <text x="616" y="68">who benefits?</text>
          <text x="528" y="176">four parts</text>
          <text x="352" y="176">a procedure</text>
          <text x="176" y="176">value first</text>
        </g>
      </g>
    </svg>
  </div>
</body>
</html>
