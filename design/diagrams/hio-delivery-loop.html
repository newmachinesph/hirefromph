<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The HIO delivery loop</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --paper: #FFFFFF;
      --band: #F7F6FF;
      --ink: #0E1230;
      --ink-soft: #4A4F66;
      --ink-faint: #6B7087;
      --line: #E4E4EA;
      --line-strong: #CFCFD8;
      --primary: #4B4EF6;
      --primary-tint: #EEEDFF;
      --info: #4A4F66;
      --font-display: 'Cabinet Grotesk', 'Inter', ui-sans-serif, system-ui, sans-serif;
      --font-text: 'Inter', ui-sans-serif, system-ui, sans-serif;
    }
    body {
      font-family: var(--font-text);
      background: var(--paper);
      color: var(--ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1280px; width: 100%; }
    .eyebrow {
      font-family: var(--font-text);
      font-size: 0.625rem;
      font-weight: 600;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--ink-faint);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-display);
      font-size: 1.75rem;
      font-weight: 700;
      letter-spacing: -0.01em;
      line-height: 1.15;
      color: var(--ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 560px; display: block; }
    .footnote {
      margin-top: 1rem;
      font-size: 0.75rem;
      font-weight: 500;
      line-height: 1.5;
      color: var(--ink-faint);
    }
  </style>
</head>
<body>
  <div class="frame">
    <!--
      Plan (confirm-before-drawing; user not reachable, proceeding):
      Type: Loop / flywheel (type-loop.md). Size preset: doc-wide, viewBox 0 0 1280 720, standard ramp.
      Content: 9 stations clockwise from the top plus one hub. Nine is the global node cap in SKILL.md and one
      over the Loop reference's 8-station ceiling; accepted because the caller fixed the content.
      Mitigation: station names are 4 words or fewer with the rest in sublabels; no ring labels; a single
      write-back spoke (Deliver into the hub) instead of nine. Accent (2): the 09 to 01 return arc and the hub.
      No quantities anywhere. Geometry from the type's section 2 formulas: C = (640,360), R = 280,
      stations 160 by 72 snapped to the 4px grid and mirrored for symmetry, hub 200 by 96; ring segments are
      same-circle arcs (A 280 280 0 0 1), the documented Loop exception to the orthogonal rule.
    -->
    <p class="eyebrow">Loop · Hire From PH</p>
    <h1>The HIO delivery loop</h1>

    <svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="hio-delivery-loop-title hio-delivery-loop-desc">
      <title id="hio-delivery-loop-title">The HIO delivery loop</title>
      <desc id="hio-delivery-loop-desc">Nine steps in a clockwise cycle — secure the requirement, convert to tasks, recruit and assess, train, route tasks, review in layers, measure, deliver, feed back — with the feedback step returning to the first, and a shared hub in the centre, the client's AI development cycle, that the deliver step writes into.</desc>

      <defs>
        <marker id="hio-delivery-loop-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4A4F66"/></marker>
        <marker id="hio-delivery-loop-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4B4EF6"/></marker>
        <marker id="hio-delivery-loop-arrow-sm" markerWidth="6" markerHeight="5" refX="5" refY="2.5" orient="auto"><polygon points="0 0, 6 2.5, 0 5" fill="#6B7087"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#FFFFFF"/>

      <!-- Ring flow: clockwise circular arcs on the station circle (C = 640,360; R = 280). The 9 → 1 return is the accent. -->
      <path d="M 720,91.672 A 280 280 0 0 1 760.968,107.479" fill="none" stroke="#4A4F66" stroke-width="1.2" marker-end="url(#hio-delivery-loop-arrow)"/>
      <path d="M 854.476,180 A 280 280 0 0 1 906.741,274.856" fill="none" stroke="#4A4F66" stroke-width="1.2" marker-end="url(#hio-delivery-loop-arrow)"/>
      <path d="M 919.743,348 A 280 280 0 0 1 900.413,462.885" fill="none" stroke="#4A4F66" stroke-width="1.2" marker-end="url(#hio-delivery-loop-arrow)"/>
      <path d="M 857.771,536 A 280 280 0 0 1 803.506,587.301" fill="none" stroke="#4A4F66" stroke-width="1.2" marker-end="url(#hio-delivery-loop-arrow)"/>
      <path d="M 656,639.542 A 280 280 0 0 1 625.198,639.608" fill="none" stroke="#4A4F66" stroke-width="1.2" marker-end="url(#hio-delivery-loop-arrow)"/>
      <path d="M 477.47,588 A 280 280 0 0 1 422.986,536.932" fill="none" stroke="#4A4F66" stroke-width="1.2" marker-end="url(#hio-delivery-loop-arrow)"/>
      <path d="M 380.031,464 A 280 280 0 0 1 360.208,349.199" fill="none" stroke="#4A4F66" stroke-width="1.2" marker-end="url(#hio-delivery-loop-arrow)"/>
      <path d="M 372.897,276 A 280 280 0 0 1 424.754,180.921" fill="none" stroke="#4A4F66" stroke-width="1.2" marker-end="url(#hio-delivery-loop-arrow)"/>
      <path d="M 517.951,108 A 280 280 0 0 1 558.851,92.017" fill="none" stroke="#4B4EF6" stroke-width="1.2" marker-end="url(#hio-delivery-loop-arrow-accent)"/>
      <!-- Write-back spoke: Deliver → the client's cycle (dashed, soft, stops 6px short of the hub) -->
      <line x1="444" y1="326.106" x2="534.091" y2="341.325" stroke="#6B7087" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#hio-delivery-loop-arrow-sm)"/>

      <!-- Stations -->
      <rect x="560" y="44" width="160" height="72" rx="8" fill="#FFFFFF" stroke="#CFCFD8" stroke-width="1"/>
      <rect x="740" y="108" width="160" height="72" rx="8" fill="#FFFFFF" stroke="#CFCFD8" stroke-width="1"/>
      <rect x="836" y="276" width="160" height="72" rx="8" fill="#FFFFFF" stroke="#CFCFD8" stroke-width="1"/>
      <rect x="804" y="464" width="160" height="72" rx="8" fill="#FFFFFF" stroke="#CFCFD8" stroke-width="1"/>
      <rect x="656" y="588" width="160" height="72" rx="8" fill="#FFFFFF" stroke="#CFCFD8" stroke-width="1"/>
      <rect x="464" y="588" width="160" height="72" rx="8" fill="#FFFFFF" stroke="#CFCFD8" stroke-width="1"/>
      <rect x="316" y="464" width="160" height="72" rx="8" fill="#FFFFFF" stroke="#CFCFD8" stroke-width="1"/>
      <rect x="284" y="276" width="160" height="72" rx="8" fill="#FFFFFF" stroke="#CFCFD8" stroke-width="1"/>
      <rect x="380" y="108" width="160" height="72" rx="8" fill="#FFFFFF" stroke="#CFCFD8" stroke-width="1"/>
      <!-- Hub: accumulated state, the one focal node -->
      <rect x="540" y="312" width="200" height="96" rx="8" fill="#EEEDFF" stroke="#4B4EF6" stroke-width="1.2"/>

      <g font-family="Inter, ui-sans-serif, system-ui, sans-serif" text-anchor="middle">
        <text x="640" y="64" fill="#6B7087" font-size="10" font-weight="600" letter-spacing="1.6" style="font-variant-numeric: tabular-nums">01</text>
        <text x="640" y="82" fill="#0E1230" font-size="12" font-weight="600">Secure the requirement</text>
        <text x="640" y="98" fill="#4A4F66" font-size="10" font-weight="500">from the client</text>
        <text x="820" y="128" fill="#6B7087" font-size="10" font-weight="600" letter-spacing="1.6" style="font-variant-numeric: tabular-nums">02</text>
        <text x="820" y="146" fill="#0E1230" font-size="12" font-weight="600">Convert to tasks</text>
        <text x="820" y="162" fill="#4A4F66" font-size="10" font-weight="500">measurable human tasks</text>
        <text x="916" y="296" fill="#6B7087" font-size="10" font-weight="600" letter-spacing="1.6" style="font-variant-numeric: tabular-nums">03</text>
        <text x="916" y="314" fill="#0E1230" font-size="12" font-weight="600">Recruit and assess</text>
        <text x="916" y="330" fill="#4A4F66" font-size="10" font-weight="500">contributors</text>
        <text x="884" y="484" fill="#6B7087" font-size="10" font-weight="600" letter-spacing="1.6" style="font-variant-numeric: tabular-nums">04</text>
        <text x="884" y="502" fill="#0E1230" font-size="12" font-weight="600">Train</text>
        <text x="884" y="518" fill="#4A4F66" font-size="10" font-weight="500">to project standards</text>
        <text x="736" y="608" fill="#6B7087" font-size="10" font-weight="600" letter-spacing="1.6" style="font-variant-numeric: tabular-nums">05</text>
        <text x="736" y="626" fill="#0E1230" font-size="12" font-weight="600">Route tasks</text>
        <text x="736" y="642" fill="#4A4F66" font-size="10" font-weight="500">through a secure platform</text>
        <text x="544" y="608" fill="#6B7087" font-size="10" font-weight="600" letter-spacing="1.6" style="font-variant-numeric: tabular-nums">06</text>
        <text x="544" y="626" fill="#0E1230" font-size="12" font-weight="600">Review in layers</text>
        <text x="544" y="642" fill="#4A4F66" font-size="10" font-weight="500">reach consensus</text>
        <text x="396" y="480" fill="#6B7087" font-size="10" font-weight="600" letter-spacing="1.6" style="font-variant-numeric: tabular-nums">07</text>
        <text x="396" y="498" fill="#0E1230" font-size="12" font-weight="600">Measure</text>
        <text x="396" y="512" fill="#4A4F66" font-size="10" font-weight="500">accuracy, consistency,</text>
        <text x="396" y="526" fill="#4A4F66" font-size="10" font-weight="500">throughput, safety</text>
        <text x="364" y="292" fill="#6B7087" font-size="10" font-weight="600" letter-spacing="1.6" style="font-variant-numeric: tabular-nums">08</text>
        <text x="364" y="310" fill="#0E1230" font-size="12" font-weight="600">Deliver</text>
        <text x="364" y="324" fill="#4A4F66" font-size="10" font-weight="500">data, evaluations, findings,</text>
        <text x="364" y="338" fill="#4A4F66" font-size="10" font-weight="500">or managed operations</text>
        <text x="460" y="128" fill="#6B7087" font-size="10" font-weight="600" letter-spacing="1.6" style="font-variant-numeric: tabular-nums">09</text>
        <text x="460" y="146" fill="#0E1230" font-size="12" font-weight="600">Feed back</text>
        <text x="460" y="162" fill="#4A4F66" font-size="10" font-weight="500">errors and edge cases</text>
        <text x="640" y="348" fill="#6B7087" font-size="10" font-weight="600" letter-spacing="1.6">SHARED HUB</text>
        <text x="640" y="368" fill="#0E1230" font-size="12" font-weight="600">Client&#8217;s AI</text>
        <text x="640" y="384" fill="#0E1230" font-size="12" font-weight="600">development cycle</text>
      </g>
    </svg>
  </div>
</body>
</html>
