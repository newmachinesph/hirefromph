<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your first week, day by day</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --paper: #FFFFFF;
      --band: #F7F6FF;
      --ink: #0E1230;
      --ink-soft: #4A4F66;
      --ink-faint: #6B7087;
      --line: #E4E4EA;
      --line-strong: #CFCFD8;
      --primary: #4B4EF6;
      --primary-tint: #EEEDFF;
      --info: #026AA2;
      --font-display: 'Cabinet Grotesk', 'Inter', ui-sans-serif, system-ui, sans-serif;
      --font-text: 'Inter', ui-sans-serif, system-ui, sans-serif;
    }
    body {
      font-family: var(--font-text);
      background: var(--paper);
      color: var(--ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1040px; width: 100%; }
    .eyebrow {
      font-family: var(--font-text);
      font-size: 0.625rem;
      font-weight: 600;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--ink-faint);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-display);
      font-size: 1.75rem;
      font-weight: 700;
      letter-spacing: -0.01em;
      line-height: 1.15;
      color: var(--ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 560px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Timeline · Hire From PH</p>
    <h1>Your first week, day by day</h1>

    <svg viewBox="0 0 720 176" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="first-week-timeline-title first-week-timeline-desc">
      <title id="first-week-timeline-title">Your first week, day by day</title>
      <desc id="first-week-timeline-desc">Five equally spaced markers on one baseline, day one to day five, each naming the checkpoint for that day: send your recap, start a dated log, turn repeat steps into an SOP, time-box then ask, and send the update before it is requested. Day one is highlighted.</desc>

      <rect width="100%" height="100%" fill="#FFFFFF"/>

      <!-- Baseline -->
      <line x1="32" y1="96" x2="688" y2="96" stroke="#CFCFD8" stroke-width="1"/>

      <!-- Label drops -->
      <g stroke="#E4E4EA" stroke-width="1">
        <line x1="96"  y1="48" x2="96"  y2="88"/>
        <line x1="228" y1="48" x2="228" y2="88"/>
        <line x1="360" y1="48" x2="360" y2="88"/>
        <line x1="492" y1="48" x2="492" y2="88"/>
        <line x1="624" y1="48" x2="624" y2="88"/>
      </g>

      <!-- Day eyebrows -->
      <g font-family="'Inter', ui-sans-serif, system-ui, sans-serif" font-size="10" font-weight="600" letter-spacing="1.8" text-anchor="middle">
        <text x="96"  y="40" fill="#4B4EF6">DAY 1</text>
        <text x="228" y="40" fill="#6B7087">DAY 2</text>
        <text x="360" y="40" fill="#6B7087">DAY 3</text>
        <text x="492" y="40" fill="#6B7087">DAY 4</text>
        <text x="624" y="40" fill="#6B7087">DAY 5</text>
      </g>

      <!-- Markers: day 1 is the one focal element -->
      <circle cx="96"  cy="96" r="8" fill="#4B4EF6"/>
      <circle cx="228" cy="96" r="6" fill="#0E1230"/>
      <circle cx="360" cy="96" r="6" fill="#0E1230"/>
      <circle cx="492" cy="96" r="6" fill="#0E1230"/>
      <circle cx="624" cy="96" r="6" fill="#0E1230"/>

      <!-- Checkpoints -->
      <g fill="#4A4F66" font-family="'Inter', ui-sans-serif, system-ui, sans-serif" font-size="10" font-weight="500" text-anchor="middle">
        <text x="96"  y="124">Send your recap</text>
        <text x="96"  y="140">in your own words</text>
        <text x="228" y="124">Start a dated log</text>
        <text x="228" y="140">of what you touched</text>
        <text x="360" y="124">Turn repeat steps</text>
        <text x="360" y="140">into one SOP</text>
        <text x="492" y="124">Time-box, then ask</text>
        <text x="492" y="140">with what you tried</text>
        <text x="624" y="124">Send the update</text>
        <text x="624" y="140">before it is asked for</text>
      </g>
    </svg>
  </div>
</body>
</html>
