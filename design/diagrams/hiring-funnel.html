<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>What each stage of the hunt needs</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --paper: #FFFFFF;
      --band: #F7F6FF;
      --ink: #0E1230;
      --ink-soft: #4A4F66;
      --ink-faint: #6B7087;
      --line: #E4E4EA;
      --line-strong: #CFCFD8;
      --primary: #4B4EF6;
      --primary-tint: #EEEDFF;
      --info: #026AA2;
      --font-display: 'Cabinet Grotesk', 'Inter', ui-sans-serif, system-ui, sans-serif;
      --font-text: 'Inter', ui-sans-serif, system-ui, sans-serif;
    }
    body {
      font-family: var(--font-text);
      background: var(--paper);
      color: var(--ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 720px; width: 100%; }
    .eyebrow {
      font-family: var(--font-text);
      font-size: 0.625rem;
      font-weight: 600;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--ink-faint);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-display);
      font-size: 1.75rem;
      font-weight: 700;
      letter-spacing: -0.01em;
      line-height: 1.15;
      color: var(--ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 560px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Funnel · Hire From PH</p>
    <h1>What each stage of the hunt needs</h1>

    <svg viewBox="0 0 560 288" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="hiring-funnel-title hiring-funnel-desc">
      <title id="hiring-funnel-title">What each stage of the hunt needs</title>
      <desc id="hiring-funnel-desc">A four-band funnel — applications, replies, interviews, offers — where each band names what that stage needs rather than a count: proof not promises, a tracked follow-up, STAR answers and questions for them, and negotiating with evidence at the narrow end.</desc>

      <rect width="100%" height="100%" fill="#FFFFFF"/>

      <!-- Bands, widest to narrowest. Widths are ordinal, not measured. -->
      <polygon points="60,32 500,32 468,88 92,88"     fill="#FFFFFF" stroke="#CFCFD8" stroke-width="1"/>
      <polygon points="92,88 468,88 436,144 124,144"  fill="#FFFFFF" stroke="#CFCFD8" stroke-width="1"/>
      <polygon points="124,144 436,144 404,200 156,200" fill="#FFFFFF" stroke="#CFCFD8" stroke-width="1"/>
      <!-- Offers — the one focal band -->
      <polygon points="156,200 404,200 372,256 188,256" fill="#EEEDFF" stroke="#4B4EF6" stroke-width="1.2"/>

      <g font-family="'Inter', ui-sans-serif, system-ui, sans-serif" text-anchor="middle">
        <g fill="#0E1230" font-size="12" font-weight="600">
          <text x="280" y="56">Applications</text>
          <text x="280" y="112">Replies</text>
          <text x="280" y="168">Interviews</text>
          <text x="280" y="224">Offers</text>
        </g>
        <g fill="#4A4F66" font-size="10" font-weight="500">
          <text x="280" y="72">proof, not promises</text>
          <text x="280" y="128">a tracked follow-up</text>
          <text x="280" y="184">STAR answers + questions for them</text>
          <text x="280" y="240">negotiate with evidence</text>
        </g>
      </g>

      <text x="32" y="280" fill="#6B7087" font-family="'Inter', ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="500" font-style="italic">The widths show the shape of the drop-off, not measured rates.</text>
    </svg>
  </div>
</body>
</html>
