<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>From call center to intelligence center</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --paper: #FFFFFF;
      --band: #F7F6FF;
      --ink: #0E1230;
      --ink-soft: #4A4F66;
      --ink-faint: #6B7087;
      --line: #E4E4EA;
      --line-strong: #CFCFD8;
      --primary: #4B4EF6;
      --primary-tint: #EEEDFF;
      --info: #4A4F66;
      --font-display: 'Cabinet Grotesk', 'Inter', ui-sans-serif, system-ui, sans-serif;
      --font-text: 'Inter', ui-sans-serif, system-ui, sans-serif;
    }
    body {
      font-family: var(--font-text);
      background: var(--paper);
      color: var(--ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1280px; width: 100%; }
    .eyebrow {
      font-family: var(--font-text);
      font-size: 0.625rem;
      font-weight: 600;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--ink-faint);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-display);
      font-size: 1.75rem;
      font-weight: 700;
      letter-spacing: -0.01em;
      line-height: 1.15;
      color: var(--ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 560px; display: block; }
    .footnote {
      margin-top: 1rem;
      font-size: 0.75rem;
      font-weight: 500;
      line-height: 1.5;
      color: var(--ink-faint);
    }
  </style>
</head>
<body>
  <div class="frame">
    <!--
      Plan (confirm-before-drawing; user not reachable, proceeding):
      Type: Process, semantic pattern "stage framework with semantic slots" — two stages as rows, four slots as
      columns (Client need, Work, Measured by, Deliverable). Size preset: doc-wide, viewBox 0 0 1280 720,
      standard ramp. 8 nodes, 6 forward arrows, 1 dashed row-to-row arrow. Accent (1): the HIO Work node.
      Cuts: none — the slot grid is the content. The Process type's lane tints, dot grid, role chips and IN/OUT
      data chips are dropped: the house rules forbid dot grids and container chrome, and the chips would carry
      invented codes. No quantities anywhere (AHT, CSAT and volume are metric names, not values).
      Geometry: label column x 40 to 232; nodes 224 by 112 at x = 240, 496, 752, 1008 with 32px corridors;
      rows at y = 160 and 440; the dashed arrow is a same-x vertical at 608 between the two Work nodes,
      labelled beside the stroke on a paper mask with an 8px gap.
    -->
    <p class="eyebrow">Stage framework · Hire From PH</p>
    <h1>From call center to intelligence center</h1>

    <svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="hio-transition-title hio-transition-desc">
      <title id="hio-transition-title">From call center to intelligence center</title>
      <desc id="hio-transition-desc">Two rows compared across the same four slots — client need, work, measured by, deliverable. Traditional BPO runs a repeatable business process through scripted handling, measured by handling time, satisfaction and volume, to produce processed transactions. Human intelligence outsourcing takes an AI system that must be trained, tested and supervised through judgment work, measured by accuracy, agreement, calibration and safety findings, to produce datasets, evaluations, findings and managed review. A dashed arrow from the BPO work to the HIO work reads "same workforce, retrained".</desc>

      <defs>
        <marker id="hio-transition-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4A4F66"/></marker>
        <marker id="hio-transition-arrow-sm" markerWidth="6" markerHeight="5" refX="5" refY="2.5" orient="auto"><polygon points="0 0, 6 2.5, 0 5" fill="#6B7087"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#FFFFFF"/>

      <!-- Connectors first (z-order). Row 1: BPO -->
      <line x1="464" y1="216" x2="496" y2="216" stroke="#4A4F66" stroke-width="1" marker-end="url(#hio-transition-arrow)"/>
      <line x1="720" y1="216" x2="752" y2="216" stroke="#4A4F66" stroke-width="1" marker-end="url(#hio-transition-arrow)"/>
      <line x1="976" y1="216" x2="1008" y2="216" stroke="#4A4F66" stroke-width="1" marker-end="url(#hio-transition-arrow)"/>
      <!-- Row 2: HIO -->
      <line x1="464" y1="496" x2="496" y2="496" stroke="#4A4F66" stroke-width="1" marker-end="url(#hio-transition-arrow)"/>
      <line x1="720" y1="496" x2="752" y2="496" stroke="#4A4F66" stroke-width="1" marker-end="url(#hio-transition-arrow)"/>
      <line x1="976" y1="496" x2="1008" y2="496" stroke="#4A4F66" stroke-width="1" marker-end="url(#hio-transition-arrow)"/>

      <!-- BPO Work to HIO Work: the same people, retrained (dashed, same-x vertical) -->
      <line x1="608" y1="272" x2="608" y2="440" stroke="#6B7087" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#hio-transition-arrow-sm)"/>
      <rect x="616" y="348" width="196" height="16" rx="4" fill="#FFFFFF"/>
      <text x="624" y="360" fill="#6B7087" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="10" font-weight="600" letter-spacing="1">SAME WORKFORCE, RETRAINED</text>

      <!-- Row 1 nodes: Traditional BPO -->
      <rect x="240"  y="160" width="224" height="112" rx="8" fill="#FFFFFF" stroke="#CFCFD8" stroke-width="1"/>
      <rect x="496"  y="160" width="224" height="112" rx="8" fill="#FFFFFF" stroke="#CFCFD8" stroke-width="1"/>
      <rect x="752"  y="160" width="224" height="112" rx="8" fill="#FFFFFF" stroke="#CFCFD8" stroke-width="1"/>
      <rect x="1008" y="160" width="224" height="112" rx="8" fill="#FFFFFF" stroke="#CFCFD8" stroke-width="1"/>

      <!-- Row 2 nodes: HIO — Work is the single focal node -->
      <rect x="240"  y="440" width="224" height="112" rx="8" fill="#FFFFFF" stroke="#CFCFD8" stroke-width="1"/>
      <rect x="496"  y="440" width="224" height="112" rx="8" fill="#EEEDFF" stroke="#4B4EF6" stroke-width="1.2"/>
      <rect x="752"  y="440" width="224" height="112" rx="8" fill="#FFFFFF" stroke="#CFCFD8" stroke-width="1"/>
      <rect x="1008" y="440" width="224" height="112" rx="8" fill="#FFFFFF" stroke="#CFCFD8" stroke-width="1"/>

      <g font-family="Inter, ui-sans-serif, system-ui, sans-serif">
        <!-- Slot headers -->
        <g fill="#6B7087" font-size="10" font-weight="600" letter-spacing="1.6" text-anchor="middle">
          <text x="352"  y="128">CLIENT NEED</text>
          <text x="608"  y="128">WORK</text>
          <text x="864"  y="128">MEASURED BY</text>
          <text x="1120" y="128">DELIVERABLE</text>
        </g>

        <!-- Row labels -->
        <g fill="#6B7087" font-size="10" font-weight="600" letter-spacing="1.6">
          <text x="40" y="200">TODAY</text>
          <text x="40" y="472">NEXT</text>
        </g>
        <g fill="#0E1230" font-size="12" font-weight="600">
          <text x="40" y="220">Traditional BPO</text>
          <text x="40" y="492">Human Intelligence</text>
          <text x="40" y="508">Outsourcing (HIO)</text>
        </g>

        <!-- Node names -->
        <g fill="#0E1230" font-size="12" font-weight="600" text-anchor="middle">
          <text x="352"  y="204">Business process</text>
          <text x="608"  y="204">Scripted handling</text>
          <text x="864"  y="204">AHT · CSAT · volume</text>
          <text x="1120" y="204">Processed transactions</text>
          <text x="352"  y="484">An AI system</text>
          <text x="608"  y="484">Judgment</text>
          <text x="864"  y="484">Accuracy · agreement</text>
          <text x="1120" y="484">Datasets · evaluations</text>
        </g>

        <!-- Sublabels -->
        <g fill="#4A4F66" font-size="10" font-weight="500" text-anchor="middle">
          <text x="352"  y="224">repeatable</text>
          <text x="608"  y="224">calls, tickets,</text>
          <text x="608"  y="240">back-office queues</text>
          <text x="864"  y="224">handling time,</text>
          <text x="864"  y="240">satisfaction, count</text>
          <text x="1120" y="224">closed calls, tickets, cases</text>
          <text x="352"  y="504">to be trained, tested,</text>
          <text x="352"  y="520">supervised</text>
          <text x="608"  y="504">labeling, comparing, evaluating,</text>
          <text x="608"  y="520">red-teaming, reviewing</text>
          <text x="864"  y="504">calibration,</text>
          <text x="864"  y="520">safety findings</text>
          <text x="1120" y="504">findings, managed review</text>
        </g>
      </g>
    </svg>
  </div>
</body>
</html>
