<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The path — five stages, eleven steps</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --paper: #FFFFFF;
      --band: #F7F6FF;
      --ink: #0E1230;
      --ink-soft: #4A4F66;
      --ink-faint: #6B7087;
      --line: #E4E4EA;
      --line-strong: #CFCFD8;
      --primary: #4B4EF6;
      --primary-tint: #EEEDFF;
      --info: #026AA2;
      --font-display: 'Cabinet Grotesk', 'Inter', ui-sans-serif, system-ui, sans-serif;
      --font-text: 'Inter', ui-sans-serif, system-ui, sans-serif;
    }
    body {
      font-family: var(--font-text);
      background: var(--paper);
      color: var(--ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1040px; width: 100%; }
    .eyebrow {
      font-family: var(--font-text);
      font-size: 0.625rem;
      font-weight: 600;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--ink-faint);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-display);
      font-size: 1.75rem;
      font-weight: 700;
      letter-spacing: -0.01em;
      line-height: 1.15;
      color: var(--ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 560px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Journey / process · Hire From PH</p>
    <h1>The path — five stages, eleven steps</h1>

    <svg viewBox="0 0 720 224" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="journey-map-title journey-map-desc">
      <title id="journey-map-title">The path — five stages, eleven steps</title>
      <desc id="journey-map-desc">A left-to-right line of the five Hire From PH stages, from Start Right to Own, with the eleven numbered steps shown as tick marks grouped under the stage they belong to; the first stage and the reader's current stage are marked in the accent colour.</desc>

      <rect width="100%" height="100%" fill="#FFFFFF"/>

      <!-- Spine (drawn before the stage nodes) -->
      <line x1="88" y1="72" x2="632" y2="72" stroke="#CFCFD8" stroke-width="1"/>

      <!-- Step rail segments, one per stage: the segment is the grouping -->
      <line x1="40"  y1="168" x2="136" y2="168" stroke="#E4E4EA" stroke-width="1"/>
      <line x1="176" y1="168" x2="272" y2="168" stroke="#E4E4EA" stroke-width="1"/>
      <line x1="312" y1="168" x2="408" y2="168" stroke="#E4E4EA" stroke-width="1"/>
      <line x1="448" y1="168" x2="544" y2="168" stroke="#E4E4EA" stroke-width="1"/>
      <line x1="584" y1="168" x2="680" y2="168" stroke="#E4E4EA" stroke-width="1"/>

      <!-- Step ticks + numbers -->
      <g stroke="#CFCFD8" stroke-width="1">
        <line x1="72"  y1="168" x2="72"  y2="180"/>
        <line x1="104" y1="168" x2="104" y2="180"/>
        <line x1="200" y1="168" x2="200" y2="180"/>
        <line x1="224" y1="168" x2="224" y2="180"/>
        <line x1="248" y1="168" x2="248" y2="180"/>
        <line x1="336" y1="168" x2="336" y2="180"/>
        <line x1="360" y1="168" x2="360" y2="180"/>
        <line x1="384" y1="168" x2="384" y2="180"/>
        <line x1="496" y1="168" x2="496" y2="180"/>
        <line x1="616" y1="168" x2="616" y2="180"/>
        <line x1="648" y1="168" x2="648" y2="180"/>
      </g>
      <g fill="#6B7087" font-family="'Inter', ui-sans-serif, system-ui, sans-serif" font-size="10" font-weight="500" text-anchor="middle" style="font-variant-numeric: tabular-nums">
        <text x="72"  y="196">1</text>
        <text x="104" y="196">2</text>
        <text x="200" y="196">3</text>
        <text x="224" y="196">4</text>
        <text x="248" y="196">5</text>
        <text x="336" y="196">6</text>
        <text x="360" y="196">7</text>
        <text x="384" y="196">8</text>
        <text x="496" y="196">9</text>
        <text x="616" y="196">10</text>
        <text x="648" y="196">11</text>
      </g>

      <!-- Stage 1 — focal (the entry point) -->
      <circle cx="88" cy="72" r="20" fill="#EEEDFF" stroke="#4B4EF6" stroke-width="1.2"/>
      <text x="88" y="78" fill="#4B4EF6" font-family="'Cabinet Grotesk', 'Inter', ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="700" text-anchor="middle" style="font-variant-numeric: tabular-nums">1</text>

      <!-- Stage 2 — focal in this rendering (current = 2) -->
      <text x="224" y="40" fill="#4B4EF6" font-family="'Inter', ui-sans-serif, system-ui, sans-serif" font-size="10" font-weight="600" letter-spacing="1.8" text-anchor="middle">YOU ARE HERE</text>
      <line x1="224" y1="44" x2="224" y2="52" stroke="#4B4EF6" stroke-width="1"/>
      <circle cx="224" cy="72" r="20" fill="#EEEDFF" stroke="#4B4EF6" stroke-width="1.2"/>
      <text x="224" y="78" fill="#4B4EF6" font-family="'Cabinet Grotesk', 'Inter', ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="700" text-anchor="middle" style="font-variant-numeric: tabular-nums">2</text>

      <!-- Stages 3–5 -->
      <circle cx="360" cy="72" r="20" fill="#FFFFFF" stroke="#CFCFD8" stroke-width="1"/>
      <text x="360" y="78" fill="#0E1230" font-family="'Cabinet Grotesk', 'Inter', ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="700" text-anchor="middle" style="font-variant-numeric: tabular-nums">3</text>
      <circle cx="496" cy="72" r="20" fill="#FFFFFF" stroke="#CFCFD8" stroke-width="1"/>
      <text x="496" y="78" fill="#0E1230" font-family="'Cabinet Grotesk', 'Inter', ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="700" text-anchor="middle" style="font-variant-numeric: tabular-nums">4</text>
      <circle cx="632" cy="72" r="20" fill="#FFFFFF" stroke="#CFCFD8" stroke-width="1"/>
      <text x="632" y="78" fill="#0E1230" font-family="'Cabinet Grotesk', 'Inter', ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="700" text-anchor="middle" style="font-variant-numeric: tabular-nums">5</text>

      <!-- Stage names -->
      <g fill="#0E1230" font-family="'Inter', ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">
        <text x="88"  y="120">Start Right</text>
        <text x="224" y="120">Get Hired</text>
        <text x="360" y="120">Deliver</text>
        <text x="496" y="120">Level Up</text>
        <text x="632" y="120">Own</text>
      </g>
      <g fill="#6B7087" font-family="'Inter', ui-sans-serif, system-ui, sans-serif" font-size="10" font-weight="500" text-anchor="middle" style="font-variant-numeric: tabular-nums">
        <text x="88"  y="136">Steps 1–2</text>
        <text x="224" y="136">Steps 3–5</text>
        <text x="360" y="136">Steps 6–8</text>
        <text x="496" y="136">Step 9</text>
        <text x="632" y="136">Steps 10–11</text>
      </g>
    </svg>
  </div>
</body>
</html>
