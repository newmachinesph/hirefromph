<svg viewBox="55 53 849 531" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="hio-career-pathways-title hio-career-pathways-desc">
  <title id="hio-career-pathways-title">Ten BPO roles, ten intelligence-center roles</title>
  <desc id="hio-career-pathways-desc">Five of the ten role pairs, each a BPO role today mapped to its intelligence-center counterpart: call-center agent to conversational-AI evaluator, quality analyst to AI quality and safety analyst, team leader to human-in-the-loop team lead, healthcare BPO specialist to medical-AI data specialist, and content moderator to trust-and-safety evaluator; the human-in-the-loop team lead is highlighted.</desc>

  <defs>
    <marker id="hio-career-pathways-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4A4F66"/></marker>
  </defs>

  <rect x="55" y="53" width="849" height="531" fill="#FFFFFF"/>

  <!-- Connectors first (z-order): straight, same-y, one per pair -->
  <line x1="400" y1="148" x2="560" y2="148" stroke="#4A4F66" stroke-width="1" marker-end="url(#hio-career-pathways-arrow)"/>
  <line x1="400" y1="244" x2="560" y2="244" stroke="#4A4F66" stroke-width="1" marker-end="url(#hio-career-pathways-arrow)"/>
  <line x1="400" y1="340" x2="560" y2="340" stroke="#4A4F66" stroke-width="1" marker-end="url(#hio-career-pathways-arrow)"/>
  <line x1="400" y1="436" x2="560" y2="436" stroke="#4A4F66" stroke-width="1" marker-end="url(#hio-career-pathways-arrow)"/>
  <line x1="400" y1="532" x2="560" y2="532" stroke="#4A4F66" stroke-width="1" marker-end="url(#hio-career-pathways-arrow)"/>

  <!-- Today's roles -->
  <rect x="80" y="120" width="320" height="56" rx="8" fill="#FFFFFF" stroke="#CFCFD8" stroke-width="1"/>
  <rect x="80" y="216" width="320" height="56" rx="8" fill="#FFFFFF" stroke="#CFCFD8" stroke-width="1"/>
  <rect x="80" y="312" width="320" height="56" rx="8" fill="#FFFFFF" stroke="#CFCFD8" stroke-width="1"/>
  <rect x="80" y="408" width="320" height="56" rx="8" fill="#FFFFFF" stroke="#CFCFD8" stroke-width="1"/>
  <rect x="80" y="504" width="320" height="56" rx="8" fill="#FFFFFF" stroke="#CFCFD8" stroke-width="1"/>

  <!-- Intelligence-center roles — the team lead is the single focal node -->
  <rect x="560" y="120" width="320" height="56" rx="8" fill="#FFFFFF" stroke="#CFCFD8" stroke-width="1"/>
  <rect x="560" y="216" width="320" height="56" rx="8" fill="#FFFFFF" stroke="#CFCFD8" stroke-width="1"/>
  <rect x="560" y="312" width="320" height="56" rx="8" fill="#EEEDFF" stroke="#4B4EF6" stroke-width="1.2"/>
  <rect x="560" y="408" width="320" height="56" rx="8" fill="#FFFFFF" stroke="#CFCFD8" stroke-width="1"/>
  <rect x="560" y="504" width="320" height="56" rx="8" fill="#FFFFFF" stroke="#CFCFD8" stroke-width="1"/>

  <g font-family="Inter, ui-sans-serif, system-ui, sans-serif">
    <g fill="#6B7087" font-size="10" font-weight="600" letter-spacing="1.6">
      <text x="80"  y="88">TODAY · BPO ROLE</text>
      <text x="560" y="88">NEXT · INTELLIGENCE-CENTER ROLE</text>
    </g>
    <g fill="#0E1230" font-size="12" font-weight="600" text-anchor="middle">
      <text x="240" y="152">Call-center agent</text>
      <text x="240" y="248">Quality analyst</text>
      <text x="240" y="344">Team leader</text>
      <text x="240" y="440">Healthcare BPO specialist</text>
      <text x="240" y="536">Content moderator</text>
      <text x="720" y="152">Conversational-AI evaluator</text>
      <text x="720" y="248">AI quality &amp; safety analyst</text>
      <text x="720" y="344">Human-in-the-loop team lead</text>
      <text x="720" y="440">Medical-AI data specialist</text>
      <text x="720" y="536">Trust-and-safety evaluator</text>
    </g>
  </g>
</svg>
